# Publica o binário do MainForge como asset de um release do GitHub.
#
# Dispara ao empurrar uma tag "v*" (ex.: git tag v0.1.0 && git push origin v0.1.0), ou à mão
# pela aba Actions. É o que faz o link "baixar o aplicativo" do README existir de verdade: sem
# isto, o link aponta para uma página de releases vazia.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a carimbar no executável (ex.: 1.5.1)"
        required: true
        default: "1.5.1"

permissions:
  contents: write # necessário para criar o release e anexar o .zip

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $versao = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF -replace "refs/tags/v", ""
          } else {
            "${{ github.event.inputs.versao }}"
          }
          "valor=$versao" >> $env:GITHUB_OUTPUT

      # Os testes são a condição para publicar: binário que sai daqui vai para a máquina de
      # outras pessoas, e o guardrail de permissões dos agentes é testado justamente aqui.
      - name: Testes
        run: dotnet test MainForge.sln -c Release

      - name: Publicar
        shell: pwsh
        run: ./publicar.ps1 -Versao ${{ steps.versao.outputs.valor }}

      # ---------------------------------------------------------------------
      # Assinatura de código — opcional, e desligada enquanto não houver segredo.
      #
      # O executável sem assinatura faz o Windows mostrar "O Windows protegeu o seu PC" na
      # primeira execução: o SmartScreen acumula confiança por certificado, e sem certificado
      # ela se acumula por hash, o que zera a cada versão nova.
      #
      # Certificado custa centenas de dólares por ano — fora do que faz sentido para um projeto
      # livre. A saída gratuita é a SignPath Foundation, que fornece certificado e infraestrutura
      # de assinatura sem custo a projetos de código aberto (repositório público, licença OSI,
      # build automatizado a partir do fonte).
      #
      # Para ligar, cadastre em Settings > Secrets and variables > Actions:
      #   SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      #   SIGNPATH_POLICY_SLUG
      # Sem eles, os dois passos abaixo são pulados e o release sai sem assinatura, como hoje.
      # Confira as entradas da action na documentação do SignPath ao ligar: elas mudam entre
      # versões, e este bloco nunca chegou a rodar.
      # ---------------------------------------------------------------------
      - name: Há credencial de assinatura?
        id: assinatura
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $tem = -not [string]::IsNullOrWhiteSpace($env:TOKEN)
          "disponivel=$($tem.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Enviar o pacote para assinatura
        if: steps.assinatura.outputs.disponivel == 'true'
        id: pacote
        uses: actions/upload-artifact@v4
        with:
          name: MainForge-sem-assinatura
          path: publicado/MainForge-${{ steps.versao.outputs.valor }}-win-x64.zip

      - name: Assinar (SignPath Foundation)
        if: steps.assinatura.outputs.disponivel == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.pacote.outputs.artifact-id }}
          wait-for-completion: true
          # Volta por cima do pacote não assinado: o que vai para o release, e o que entra na
          # soma de verificação, precisa ser o arquivo assinado.
          output-artifact-directory: publicado

      # Depois da assinatura, de propósito: assinar muda os bytes do arquivo, e um checksum
      # calculado antes não conferiria com o que a pessoa baixou.
      - name: Soma de verificação
        id: hash
        shell: pwsh
        run: |
          $arquivo = "publicado/MainForge-${{ steps.versao.outputs.valor }}-win-x64.zip"
          $hash = (Get-FileHash $arquivo -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $arquivo -Leaf)" | Set-Content "$arquivo.sha256" -Encoding ascii -NoNewline
          "valor=$hash" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            publicado/MainForge-${{ steps.versao.outputs.valor }}-win-x64.zip
            publicado/MainForge-${{ steps.versao.outputs.valor }}-win-x64.zip.sha256
          generate_release_notes: true
          body: |
            Baixe o `.zip`, descompacte onde quiser e rode `MainForge.Cli.exe`.

            É preciso ter o [Claude Code](https://claude.com/product/claude-code) instalado e
            logado na sua conta — o aplicativo usa a **sua** assinatura e não guarda credencial
            nenhuma. O menu **Ambiente** confere as dependências e ajuda a instalar o que faltar.

            **O Windows vai avisar na primeira execução** ("Mais informações" › "Executar assim
            mesmo"): o executável não é assinado digitalmente, e o SmartScreen avisa sobre
            publicador desconhecido. Para conferir que o arquivo é exatamente o que este
            workflow gerou, compare a soma de verificação:

            ```
            SHA-256: ${{ steps.hash.outputs.valor }}
            ```

            ```powershell
            Get-FileHash .\MainForge-${{ steps.versao.outputs.valor }}-win-x64.zip -Algorithm SHA256
            ```
